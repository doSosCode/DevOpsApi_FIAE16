apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-api
  labels:
    app.kubernetes.io/name: task-api
  annotations:
    # HTTP-Anfragen werden auf HTTPS umgeleitet.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - task-api.local
      secretName: task-api-tls
  rules:
    - host: task-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-api
                port:
                  number: 8080
