# Optional: Minikube benötigt ein CNI, das NetworkPolicies tatsächlich durchsetzt.
# Vor Einsatz prüfen, da eine falsch konfigurierte Policy den Zugriff blockieren kann.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-only-from-task-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: task-api
      ports:
        - protocol: TCP
          port: 3306
