---
# Verwandelt eine minimale Ubuntu-VM in einen lokalen DevOps-Schulungsrunner.
# Das Playbook ist idempotent und kann wiederholt ausgeführt werden.
- name: DevOps-Schulungs-VM vollständig vorbereiten
  hosts: runner
  connection: local
  become: true

  vars:
    # Ansible wird vom Self-hosted Runner lokal gestartet. Die Fakten werden vor
    # dem privilege escalation gesammelt; ansible_user_id ist daher der Runner-Benutzer.
    runner_user: "devops"
    runner_home: "/home/devops"

    # Die Werte kommen als Workflow-Inputs über Umgebungsvariablen.
    git_user_name: "{{ lookup('env', 'TRAINING_GIT_USER_NAME') }}"
    git_user_email: "{{ lookup('env', 'TRAINING_GIT_USER_EMAIL') }}"

  tasks:

    - name: Unterstütztes Betriebssystem prüfen
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - ansible_distribution_major_version | int >= 22
        fail_msg: "Unterstützt werden Ubuntu 22.04 oder neuer."

    - name: Git-Identitaet aus Workflow-Eingaben pruefen
      ansible.builtin.assert:
        that:
          - git_user_name | trim | length > 0
          - git_user_email | trim | length > 0
          - "'@' in git_user_email"
        fail_msg: >-
          Git-Name und Git-E-Mail fehlen oder sind ungueltig.
          Starte den Bootstrap-Workflow mit beiden Eingabefeldern.

    - name: Basispakete, Java 21 und Docker installieren
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - bash-completion
          - ca-certificates
          - curl
          - git
          - gnupg
          - jq
          - openssl
          - python3
          - python3-apt
          - unzip
          - openjdk-21-jdk
          - openjdk-21-jre
          - docker.io
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Configure Docker registry CA trust directory
      ansible.builtin.file:
        path: /etc/docker/certs.d/registry.k8s.io
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Restart Docker after CA configuration
      ansible.builtin.systemd:
        name: docker
        state: restarted

    - name: Verify Docker can access Kubernetes registry
      ansible.builtin.command:
        cmd: docker pull registry.k8s.io/pause:3.10
      register: docker_registry_test
      changed_when: false

    - name: Globale Git-Konfiguration fuer den Runner-Benutzer schreiben
      ansible.builtin.template:
        src: templates/gitconfig.j2
        dest: "{{ runner_home }}/.gitconfig"
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: "0600"

    - name: Docker-Dienst starten und beim Booten aktivieren
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Runner-Benutzer der Docker-Gruppe hinzufügen
      ansible.builtin.user:
        name: "{{ runner_user }}"
        groups: docker
        append: true
        
    - name: Systemarchitektur für Binärdownloads bestimmen
      ansible.builtin.set_fact:
        binary_arch: "{{ 'amd64' if ansible_architecture in ['x86_64', 'amd64'] else 'arm64' }}"

    - name: Aktuelle stabile kubectl-Version bestimmen
      ansible.builtin.uri:
        url: https://dl.k8s.io/release/stable.txt
        return_content: true
        validate_certs: false
      register: kubectl_stable

    - name: kubectl installieren
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_stable.content | trim }}/bin/linux/{{ binary_arch }}/kubectl"
        validate_certs: false
        dest: /usr/local/bin/kubectl
        owner: root
        group: root
        mode: "0755"

    - name: Minikube installieren
      ansible.builtin.get_url:
        url: "https://github.com/kubernetes/minikube/releases/latest/download/minikube-linux-{{ binary_arch }}"
        validate_certs: false
        dest: /usr/local/bin/minikube
        owner: root
        group: root
        mode: "0755"

    - name: Check if Minikube profile exists
      ansible.builtin.command:
        cmd: minikube profile list -o json
      register: minikube_profiles
      changed_when: false
      failed_when: false

    - name: Create Minikube CA directory
      ansible.builtin.file:
        path: /etc/minikube/certs
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy Fortinet CA for Minikube
      ansible.builtin.copy:
        src: /usr/local/share/ca-certificates/fortinet.crt
        dest: /etc/minikube/certs/fortinet.crt
        remote_src: true
        owner: root
        group: root
        mode: "0644"
        
    - name: Prüfen, ob OpenTofu bereits installiert ist
      ansible.builtin.command: tofu version
      register: tofu_version
      changed_when: false
      failed_when: false

    - name: Offizielles OpenTofu-Installationsskript herunterladen
      ansible.builtin.get_url:
        url: https://get.opentofu.org/install-opentofu.sh
        validate_certs: false
        dest: /tmp/install-opentofu.sh
        mode: "0755"
      when: tofu_version.rc != 0

    - name: OpenTofu über das offizielle Debian-Repository installieren
      ansible.builtin.command:
        cmd: /tmp/install-opentofu.sh --install-method deb
      when: tofu_version.rc != 0
      changed_when: true

    - name: OpenTofu-Installationsskript entfernen
      ansible.builtin.file:
        path: /tmp/install-opentofu.sh
        state: absent

    - name: Projektverzeichnisse im Home-Verzeichnis anlegen
      become: false
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: "0700"
      loop:
        - "{{ runner_home }}/.kube"
        - "{{ runner_home }}/.minikube"
        - "{{ runner_home }}/.local/state/task-api-training"
        - "{{ runner_home }}/.local/share/task-api-training/tls"

    - name: needrestart Konfigurationsverzeichnis erstellen
      ansible.builtin.file:
        path: /etc/needrestart/conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Automatischen Runner-Neustart durch needrestart verhindern
      ansible.builtin.copy:
        dest: /etc/needrestart/conf.d/actions_runner_services.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          $nrconf{override_rc}{qr(^actions\.runner\..+\.service$)} = 0;

    - name: Installation abgeschlossen markieren
      ansible.builtin.copy:
        dest: /var/lib/task-api-training-bootstrap-complete
        owner: root
        group: root
        mode: "0644"
        content: |
          Installation durch Ansible abgeschlossen.
          Nach dem ersten Lauf ist ein Neustart erforderlich.
