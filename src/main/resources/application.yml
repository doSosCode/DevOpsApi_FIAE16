server:
  port: 8080
  address: 0.0.0.0
  server-header: ""
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB
    connection-timeout: 5s
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: task-api-training
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/taskdb}
    username: ${DB_USERNAME:taskapp}
    # Nur lokaler Entwicklungs-Fallback. In Kubernetes wird das Kennwort aus einem Secret gesetzt.
    password: ${DB_PASSWORD:taskapp-local-only}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 3000
      max-lifetime: 1700000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
